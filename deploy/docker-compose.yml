services:
  postgres:
    image: postgres:16-alpine
    container_name: parts_db
    environment:
      POSTGRES_DB: parts
      POSTGRES_USER: parts_user
      POSTGRES_PASSWORD: parts_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parts_user -d parts"]
      interval: 5s
      timeout: 3s
      retries: 5
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: parts_backend
    ports:
      - "8080:8080"
    environment:
      APP_PORT: 8080
volumes:
  postgres_data: